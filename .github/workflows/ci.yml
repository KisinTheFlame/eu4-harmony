# Builds and tests everything that runs without the game. The checks
# against eu4.exe (cargo test -- --ignored) need it installed and run by hand.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        # The version rust-toolchain.toml names.
        run: rustup toolchain install
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
