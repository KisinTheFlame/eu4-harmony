# Builds and tests everything that runs without the game. The checks
# against eu4.exe (cargo test -- --ignored) need it installed and run by hand.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# A newer push to a pull request stops the run it replaces. Every merge into
# master runs to the end, so a failure there names the merge that caused it:
# each has a group of its own, since a group holds one waiting run at most and
# drops it for the next.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    # Optimized like a player's build, but without its link-time optimization
    # and single codegen unit, which take most of the build time.
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        # The version rust-toolchain.toml names.
        run: rustup toolchain install
      # Pull requests read the cache master's runs save; saving one per pull
      # request would push master's out of the repository's cache space.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked

  clippy:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # With the trace feature and the disasm example, which a player's build
      # never has, so that they keep compiling too.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --features eu4-harmony-core/trace -- -D warnings

  # Formatting needs no Windows and no build; Linux runners start faster.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
