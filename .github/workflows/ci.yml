# Builds and tests everything that runs without the game. The checks
# against eu4.exe (cargo xtask offline-check) need it installed and run by hand.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

# A newer push to a pull request stops the run it replaces. Every merge into
# master runs to the end, so a failure there names the merge that caused it:
# each has a group of its own, since a group holds one waiting run at most and
# drops it for the next.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# The build, the tests and the developer build use the release profile, so
# that they are built as a player's build is, with no debug assertions and no
# overflow checks, but without its optimization: CI checks that they build,
# link and pass, and how fast they run does not matter there. Optimizing the
# workspace took about three quarters of the time spent compiling it, most of
# it in the (de)serializing of every request and answer.
env:
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"

# The build, the tests and the developer build each compile the whole
# workspace once, and none needs another's result, so each is a job of its own
# and they run side by side instead of one after another.
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        # The version rust-toolchain.toml names.
        run: rustup toolchain install
      # Pull requests read the cache master's runs save; saving one per pull
      # request would push master's out of the repository's cache space. Each
      # job keeps a cache of its own.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build
        run: cargo build --release --locked

  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Test
        run: cargo test --release --locked

  # The development tools, which a player's build never has, so that they keep
  # building too.
  dev-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build the developer build
        run: cargo build --release --locked --features eu4-harmony-core/dev

  clippy:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # With the development tools and the disasm example, which a player's
      # build never has.
      - name: Clippy on the developer build
        run: cargo clippy --locked --workspace --all-targets --features eu4-harmony-core/dev -- -D warnings

  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check release publication and recovery
        run: node --test .github/scripts/release.test.mjs

  # Formatting needs no Windows and no build; Linux runners start faster.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
