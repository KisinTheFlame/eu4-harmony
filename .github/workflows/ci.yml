# Builds and tests everything that runs without the game. The checks
# against eu4.exe (cargo test -- --ignored) need it installed and run by hand.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
