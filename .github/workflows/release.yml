name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Check release packages' || 'Publish merged version' }}

on:
  push:
    branches: [master]
    paths: [Cargo.toml]
  # Preparation only. A version increase merged into master requests publication.
  workflow_dispatch:

permissions:
  contents: read

# Different merged versions do not cancel each other. Retries for the same
# source cannot edit its tag or draft at the same time.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.request.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether the merged PR increases the workspace version
        id: request
        run: python3 .github/scripts/release_request.py

  source:
    needs: request
    if: needs.request.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-source
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Validate the selected source and version
        run: cargo run --locked -p xtask -- release-check --out target/dist
      - name: Record the validated commit
        id: metadata
        shell: pwsh
        run: |
          $release = Get-Content target/dist/release.json -Raw | ConvertFrom-Json
          "commit=$($release.commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: target/dist/release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  checks:
    needs: source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    needs: [source, checks]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-player
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: actions/download-artifact@v8
        with:
          name: release-source
          path: target/dist
      # Do not inherit ordinary CI's optimization overrides: these files are
      # the actual optimized player build, with no development features.
      - name: Build and check both player packages
        run: cargo xtask release --out target/dist --no-workshop
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            target/dist/*.zip
            target/dist/release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.request.outputs.publish == 'true'
    needs: [request, source, checks, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: target/dist
      - name: Create the version tag and publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUESTED: ${{ needs.request.outputs.publish }}
        run: node .github/scripts/release.mjs target/dist
