l_trad_chinese:
 # 框架自己的文字：給玩家的提示。
 EU4HARMONY_NOTICE_TITLE:0 "Harmony"
 EU4HARMONY_NOTICE_TITLE_MORE:0 "Harmony（還有 $COUNT$ 則）"
 EU4HARMONY_SKIPPED_MANIFEST:0 "已略過 Mod「$MOD$」：它的 eu4-harmony/manifest.toml 有誤。\n$DETAIL$"
 EU4HARMONY_SKIPPED_DUPLICATE_ID:0 "已略過 Mod「$MOD$」：它的 id「$ID$」已被前面啟用的另一個 Mod 使用。"
 EU4HARMONY_STARTUP_FAILED:0 "Harmony 無法啟動，基於它的 Mod 都不會生效。\n\n$DETAIL$"
 EU4HARMONY_STARTUP_WRONG_PLATFORM:0 "Harmony 無法啟動：目前遊戲來自 $PLATFORM$，而 Harmony 僅支援 Steam 平台的 Windows 版《歐陸風雲 IV》1.37.5。\n\n請在 Steam 平台的 Windows 版遊戲中使用 Harmony。"
 EU4HARMONY_STARTUP_WRONG_VERSION:0 "Harmony 無法啟動：目前遊戲版本是 $VERSION$，而 Harmony 僅支援 Steam 平台的 Windows 版 1.37.5。\n\n請在 Steam 中將遊戲切回 1.37.5（右鍵點擊《歐陸風雲 IV》→ 內容 → 測試版）後重新啟動遊戲。"
 EU4HARMONY_STARTUP_MODIFIED_EXE:0 "Harmony 無法啟動：遊戲資料夾裡的 eu4.exe 已被其他補丁修改過。Harmony 已內建返回主選單不重啟、效能提升、修正繼承人重名與成就選項，無需再使用修改版 eu4.exe。\n\n請在 Steam 中右鍵點擊《歐陸風雲 IV》→ 內容 → 已安裝檔案 → 驗證遊戲檔案的完整性，以還原原版 eu4.exe（無需重裝 Harmony），然後重新啟動遊戲。"
 EU4HARMONY_STARTUP_UNSUPPORTED_OR_MODIFIED_EXE:0 "Harmony 無法啟動：目前的 eu4.exe 與 Steam 平台的 Windows 版 1.37.5 不一致——遊戲可能不是 1.37.5，或 eu4.exe 已被修改過。\n\n請在 Steam 中確認遊戲版本為 1.37.5，並右鍵點擊《歐陸風雲 IV》→ 內容 → 已安裝檔案 → 驗證遊戲檔案的完整性以還原原版 eu4.exe，然後重新啟動遊戲。"
 EU4HARMONY_STARTUP_CONFLICTING_DLLS:0 "Harmony 無法啟動：遊戲資料夾裡還有其他補丁 DLL 被同時載入，與 Harmony 衝突（$DLLS$）。\n\n請將這些檔案移出遊戲資料夾，然後重新啟動遊戲。"
 EU4HARMONY_PROXY_OUTDATED:0 "Harmony 無法啟動，基於它的 Mod 都不會生效：遊戲資料夾裡的 version.dll 太舊了。\n\n請從 Harmony 在 Steam 創意工坊的資料夾裡重新複製 version.dll 到遊戲資料夾，放在 eu4.exe 旁邊。"
 EU4HARMONY_PROXY_UPDATED_RESTART:0 "Harmony 已自動更新遊戲資料夾裡的 version.dll，但未能自動重啟遊戲。\n\n請關閉遊戲後重新啟動，以使用新的 version.dll。"
 EU4HARMONY_PROXY_UPDATE_FAILED:0 "Harmony 未能自動更新遊戲資料夾裡的 version.dll（資料夾可能唯讀或被佔用）。遊戲仍可繼續運作，你也可以從 Harmony 的 Steam 創意工坊資料夾手動複製 version.dll 到 eu4.exe 旁。"
 EU4HARMONY_PROXY_RESTARTING:0 "Harmony 已更新，正在重啟遊戲……"
 EU4HARMONY_FATAL:0 "Harmony 遇到意外錯誤，遊戲即將關閉。\n\n$DETAIL$\n\n詳情請見遊戲文件資料夾下的 eu4-harmony/logs/core.log。"
 EU4HARMONY_API_MISMATCH:0 "Mod「$MOD$」沒有載入：它是為 Harmony 介面 $BUILT$ 製作的，而已安裝的 Harmony 提供的是 $PROVIDED$。請更新 Mod 或 Harmony，讓兩者一致。"
 EU4HARMONY_NOT_LOADED:0 "Mod「$MOD$」沒有載入：\n$DETAIL$"
 EU4HARMONY_STOPPED:0 "Mod「$MOD$」的擴充已停止運作：$DETAIL$"
