l_french:
 # Les textes du framework lui-même : les notifications au joueur.
 EU4HARMONY_NOTICE_TITLE:0 "Harmony"
 EU4HARMONY_NOTICE_TITLE_MORE:0 "Harmony ($COUNT$ de plus)"
 EU4HARMONY_SKIPPED_MANIFEST:0 "Le mod « $MOD$ » a été ignoré : son fichier eu4-harmony/manifest.toml n'est pas valide.\n$DETAIL$"
 EU4HARMONY_SKIPPED_DUPLICATE_ID:0 "Le mod « $MOD$ » a été ignoré : son identifiant « $ID$ » est déjà utilisé par un mod chargé avant lui."
 EU4HARMONY_STARTUP_FAILED:0 "Harmony n'a pas pu démarrer ; les mods qui en dépendent sont donc inactifs.\n\n$DETAIL$"
 EU4HARMONY_STARTUP_WRONG_PLATFORM:0 "Harmony n'a pas pu démarrer : ce jeu provient de $PLATFORM$, alors que Harmony ne prend en charge que la version Steam Windows d'EU4 1.37.5.\n\nUtilisez Harmony avec la version Steam Windows du jeu."
 EU4HARMONY_STARTUP_WRONG_VERSION:0 "Harmony n'a pas pu démarrer : ce jeu est en version $VERSION$, alors que Harmony ne prend en charge qu'EU4 1.37.5 sur Steam Windows.\n\nPassez le jeu en version 1.37.5 dans Steam (clic droit sur Europa Universalis IV → Propriétés → Bêtas), puis relancez le jeu."
 EU4HARMONY_STARTUP_MODIFIED_EXE:0 "Harmony n'a pas pu démarrer : le fichier eu4.exe dans le dossier du jeu a été modifié (par exemple par un autre correctif d'exécutable). Harmony inclut déjà le retour au menu principal sans redémarrer, les gains de performances, la correction des noms d'héritiers et les options de succès.\n\nDans Steam, faites un clic droit sur Europa Universalis IV → Propriétés → Fichiers installés → Vérifier l'intégrité des fichiers du jeu pour restaurer l'eu4.exe d'origine (vous n'avez pas besoin de réinstaller Harmony), puis relancez le jeu."
 EU4HARMONY_STARTUP_UNSUPPORTED_OR_MODIFIED_EXE:0 "Harmony n'a pas pu démarrer : eu4.exe ne correspond pas à la version Steam Windows 1.37.5 d'EU4 — le jeu est peut-être dans une autre version ou eu4.exe a été modifié.\n\nVérifiez dans Steam que le jeu est en version 1.37.5, puis vérifiez l'intégrité des fichiers du jeu (clic droit sur Europa Universalis IV → Propriétés → Fichiers installés) pour restaurer l'eu4.exe d'origine, et relancez le jeu."
 EU4HARMONY_STARTUP_CONFLICTING_DLLS:0 "Harmony n'a pas pu démarrer : un autre correctif s'est chargé depuis le dossier du jeu et entre en conflit avec Harmony ($DLLS$).\n\nDéplacez ces fichiers hors du dossier du jeu, puis relancez le jeu."
 EU4HARMONY_PROXY_OUTDATED:0 "Harmony n'a pas pu démarrer ; les mods qui en dépendent sont donc inactifs : le fichier version.dll du dossier du jeu est trop ancien.\n\nCopiez à nouveau version.dll depuis le dossier de Harmony dans le Workshop Steam vers le dossier du jeu, à côté d'eu4.exe."
 EU4HARMONY_PROXY_UPDATED_RESTART:0 "Harmony a mis à jour version.dll dans le dossier du jeu, mais n'a pas pu redémarrer le jeu automatiquement.\n\nFermez le jeu puis relancez-le pour utiliser la nouvelle version de version.dll."
 EU4HARMONY_PROXY_UPDATE_FAILED:0 "Harmony n'a pas pu mettre à jour version.dll automatiquement dans le dossier du jeu (le dossier est peut-être en lecture seule ou verrouillé). Vous pouvez continuer à jouer ou copier manuellement version.dll depuis le dossier de Harmony dans le Workshop Steam à côté d'eu4.exe."
 EU4HARMONY_PROXY_RESTARTING:0 "Harmony a été mis à jour. Redémarrage du jeu…"
 EU4HARMONY_FATAL:0 "Harmony a rencontré une erreur inattendue et le jeu va se fermer.\n\n$DETAIL$\n\nLes détails se trouvent dans eu4-harmony/logs/core.log, dans le dossier de documents du jeu."
 EU4HARMONY_API_MISMATCH:0 "Le mod « $MOD$ » n'a pas été chargé : il a été conçu pour l'API $BUILT$ de Harmony, mais la version installée de Harmony fournit l'API $PROVIDED$. Mettez à jour le mod ou Harmony pour qu'ils correspondent."
 EU4HARMONY_NOT_LOADED:0 "Le mod « $MOD$ » n'a pas été chargé :\n$DETAIL$"
 EU4HARMONY_STOPPED:0 "L'extension du mod « $MOD$ » a été arrêtée : $DETAIL$"
 EU4HARMONY_ERRORS:0 "L'extension du mod « $MOD$ » a rencontré une erreur. Elle continue de fonctionner ; ouvrez le dossier des journaux dans Paramètres de Harmony → Avancé pour plus de détails."
 EU4HARMONY_FONT_MISSING:0 "La police « $FONT$ » choisie dans les paramètres de Harmony n'est pas installée ; $DEFAULT$ est utilisée à la place. Choisissez une autre police dans les paramètres."
 EU4HARMONY_IRONMAN_SAVE_FAILED:0 "La partie Ironman n'a pas pu être sauvegardée, elle n'a donc pas été quittée. Vérifiez le dossier des sauvegardes, l'espace disque ou la connexion au cloud, puis réessayez."
