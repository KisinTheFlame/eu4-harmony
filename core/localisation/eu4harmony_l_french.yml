l_french:
 # Les textes du framework lui-même : les notifications au joueur.
 EU4HARMONY_NOTICE_TITLE:0 "EU4 Harmony"
 EU4HARMONY_NOTICE_TITLE_MORE:0 "EU4 Harmony ($COUNT$ de plus)"
 EU4HARMONY_SKIPPED_MANIFEST:0 "Le mod « $MOD$ » a été ignoré : son fichier eu4-harmony/manifest.toml n'est pas valide.\n$DETAIL$"
 EU4HARMONY_SKIPPED_DUPLICATE_ID:0 "Le mod « $MOD$ » a été ignoré : son identifiant « $ID$ » est déjà utilisé par un mod chargé avant lui."
 EU4HARMONY_STARTUP_FAILED:0 "EU4 Harmony n'a pas pu démarrer ; les mods qui en dépendent sont donc inactifs.\n\n$DETAIL$"
 EU4HARMONY_FATAL:0 "EU4 Harmony a rencontré une erreur inattendue et le jeu va se fermer.\n\n$DETAIL$\n\nLes détails se trouvent dans eu4-harmony/logs/core.log, dans le dossier de documents du jeu."
 EU4HARMONY_API_MISMATCH:0 "Le mod « $MOD$ » n'a pas été chargé : il a été conçu pour l'API $BUILT$ d'EU4 Harmony, mais la version installée d'EU4 Harmony fournit l'API $PROVIDED$. Mettez à jour le mod ou EU4 Harmony pour qu'ils correspondent."
 EU4HARMONY_NOT_LOADED:0 "Le mod « $MOD$ » n'a pas été chargé :\n$DETAIL$"
 EU4HARMONY_STOPPED:0 "L'extension du mod « $MOD$ » a été arrêtée : $DETAIL$"
 EU4HARMONY_ERRORS:0 "L'extension du mod « $MOD$ » a rencontré une erreur. Elle continue de fonctionner ; son journal donne les détails."
 EU4HARMONY_FONT_MISSING:0 "La police « $FONT$ » choisie dans les paramètres d'EU4 Harmony n'est pas installée ; $DEFAULT$ est utilisée à la place. Choisissez une autre police dans les paramètres."
 EU4HARMONY_IRONMAN_SAVE_FAILED:0 "La partie Ironman n'a pas pu être sauvegardée, elle n'a donc pas été quittée. Vérifiez le dossier des sauvegardes, l'espace disque ou la connexion au cloud, puis réessayez."
 EU4HARMONY_CONFIRM_LOAD_IRONMAN:0 "Charger la sauvegarde $NAME$ ? La partie Ironman en cours sera d'abord sauvegardée."
 EU4HARMONY_STILL_RETURN:0 "Retour au menu principal…"
 EU4HARMONY_STILL_LOAD:0 "Chargement de la sauvegarde…"
 EU4HARMONY_SETTINGS_BUTTON:0 "Paramètres d'EU4 Harmony"
 EU4HARMONY_SETTINGS_TITLE:0 "Paramètres d'EU4 Harmony"
 EU4HARMONY_SETTINGS_LANGUAGE:0 "Langue"
 EU4HARMONY_SETTINGS_PAGE_LANGUAGE_FONTS:0 "Langue et polices"
 EU4HARMONY_SETTINGS_PAGE_SESSIONS:0 "Chargement et retour"
 EU4HARMONY_SETTINGS_PAGE_ACHIEVEMENTS:0 "Succès"
 EU4HARMONY_SETTINGS_PAGE_GAME_SPEED:0 "Vitesse du jeu"
 EU4HARMONY_SETTINGS_BODY_FONT:0 "Police du texte"
 EU4HARMONY_SETTINGS_BODY_WEIGHT:0 "Graisse de la police du texte"
 EU4HARMONY_SETTINGS_HEADING_FONT:0 "Police des titres"
 EU4HARMONY_SETTINGS_HEADING_WEIGHT:0 "Graisse de la police des titres"
 EU4HARMONY_SETTINGS_MAP_FONT:0 "Police de la carte"
 EU4HARMONY_SETTINGS_MAP_WEIGHT:0 "Graisse de la police de la carte"
 EU4HARMONY_SETTINGS_MAP_OUTLINE:0 "Contour des noms sur la carte"
 EU4HARMONY_SETTINGS_CONSOLE_FONT:0 "Police de la console"
 EU4HARMONY_SETTINGS_CONSOLE_WEIGHT:0 "Graisse de la police de la console"
 EU4HARMONY_SETTINGS_RESTART:0 "Les modifications de langue et de police prendront effet au prochain démarrage du jeu."
 EU4HARMONY_SETTINGS_RETURN_WITHOUT_RESTART:0 "Revenir au menu principal sans redémarrer le jeu"
 EU4HARMONY_SETTINGS_SAVE_IRONMAN_BEFORE_LOAD:0 "En mode Ironman, sauvegarder la partie avant d'en charger une autre"
 EU4HARMONY_SETTINGS_UNDO:0 "Désactivé, recharger la même sauvegarde annule ce qui a été joué depuis qu'elle a été écrite."
 EU4HARMONY_SETTINGS_FASTEST_SPEED:0 "À la vitesse maximale"
 EU4HARMONY_SETTINGS_FASTEST_SPEED_INFO:0 "Temps plus rapide : en fin de partie, les jours passent environ un dixième plus vite à la vitesse maximale, mais la carte est redessinée moins souvent : elle paraît saccadée et répond un peu plus tard aux clics."
 EU4HARMONY_SETTINGS_PACE_SMOOTH:0 "Carte fluide (comme dans le jeu)"
 EU4HARMONY_SETTINGS_PACE_FASTER:0 "Temps plus rapide"
 EU4HARMONY_SETTINGS_PAGE_REMOTE_CONTROL:0 "Contrôle à distance"
 EU4HARMONY_SETTINGS_REMOTE_FULL_VIEW:0 "Le contrôle à distance voit tout"
 EU4HARMONY_SETTINGS_REMOTE_FULL_VIEW_INFO:0 "Désactivé, les programmes qui utilisent le jeu par contrôle à distance ne lisent que ce que voit le joueur : la carte sous le brouillard de guerre, et des autres pays ce que montrent leurs panneaux."
 EU4HARMONY_SETTINGS_ACHIEVEMENTS_OUTSIDE_IRONMAN:0 "Succès hors du mode Ironman"
 EU4HARMONY_SETTINGS_ACHIEVEMENTS_CHANGED_CHECKSUM:0 "Succès avec une somme de contrôle du jeu modifiée"
 EU4HARMONY_SETTINGS_ACHIEVEMENTS:0 "Les autres règles des succès restent celles du jeu. Les modifications prennent effet à la prochaine partie lancée ou chargée."
 EU4HARMONY_SETTINGS_SAVE:0 "Enregistrer"
 EU4HARMONY_SETTINGS_CANCEL:0 "Annuler"
 EU4HARMONY_MODS_BUTTON:0 "Mods EU4 Harmony"
 EU4HARMONY_MODS_TITLE:0 "Mods EU4 Harmony"
 EU4HARMONY_MODS_NONE:0 "Aucun mod EU4 Harmony n'est activé dans cette liste de lecture."
 EU4HARMONY_MODS_VERSION:0 "Version $VERSION$"
 EU4HARMONY_MODS_NO_DESCRIPTION:0 "Ce mod n'a pas de description."
 EU4HARMONY_MODS_BEYOND:0 "Au-delà du jeu, ce mod peut :"
 EU4HARMONY_MODS_CLOCK:0 "lire la date et l'heure réelles"
 EU4HARMONY_MODS_FILES:0 "garder ses propres fichiers dans $FOLDER$"
 EU4HARMONY_MODS_NETWORK:0 "envoyer et recevoir des données par Internet, avec $HOSTS$"
 EU4HARMONY_MODS_DECLARED:0 "Le mod les déclare lui-même : elles disent ce qu'il peut faire, pas ce qu'il fait."
 EU4HARMONY_MODS_NOTHING_BEYOND:0 "Ce mod ne fait rien au-delà du jeu."
