 # Les textes du framework lui-même : les notifications au joueur.
 EU4HARMONY_NOTICE_TITLE:0 "EU4 Harmony"
 EU4HARMONY_NOTICE_TITLE_MORE:0 "EU4 Harmony ($COUNT$ de plus)"
 EU4HARMONY_SKIPPED_MANIFEST:0 "Le mod « $MOD$ » a été ignoré : son fichier eu4-harmony/manifest.json n'est pas valide.\n$DETAIL$"
 EU4HARMONY_SKIPPED_DUPLICATE_ID:0 "Le mod « $MOD$ » a été ignoré : son identifiant « $ID$ » est déjà utilisé par un mod chargé avant lui."
 EU4HARMONY_STARTUP_FAILED:0 "EU4 Harmony n'a pas pu démarrer ; les mods qui en dépendent sont donc inactifs.\n\n$DETAIL$"
 EU4HARMONY_FATAL:0 "EU4 Harmony a rencontré une erreur inattendue et le jeu va se fermer.\n\n$DETAIL$\n\nLes détails se trouvent dans eu4-harmony/logs/core.log, dans le dossier de documents du jeu."
 EU4HARMONY_API_MISMATCH:0 "Le mod « $MOD$ » n'a pas été chargé : il a été conçu pour l'API $BUILT$ d'EU4 Harmony, mais la version installée d'EU4 Harmony fournit l'API $PROVIDED$. Mettez à jour le mod ou EU4 Harmony pour qu'ils correspondent."
 EU4HARMONY_NOT_LOADED:0 "Le mod « $MOD$ » n'a pas été chargé :\n$DETAIL$"
 EU4HARMONY_STOPPED:0 "Le mod « $MOD$ » a échoué et son extension a été arrêtée : $DETAIL$\n\nL'état de la partie est peut-être incohérent ; évitez d'écraser vos sauvegardes."
 EU4HARMONY_TEST_NOTICE:0 "Notification de test $NUMBER$ d'EU4 Harmony. Fermez-la avec le bouton dans son coin."
 EU4HARMONY_SETTINGS_BUTTON:0 "Paramètres d'EU4 Harmony"
 EU4HARMONY_SETTINGS_TITLE:0 "Paramètres d'EU4 Harmony"
 EU4HARMONY_SETTINGS_APPEARANCE:0 "Apparence du texte"
 EU4HARMONY_SETTINGS_BITMAP:0 "Garder les polices telles quelles"
 EU4HARMONY_SETTINGS_SYSTEM:0 "Polices du système"
 EU4HARMONY_SETTINGS_BODY_FONT:0 "Police du texte"
 EU4HARMONY_SETTINGS_MAP_FONT:0 "Police de la carte"
 EU4HARMONY_SETTINGS_RESTART:0 "Les modifications prendront effet au prochain démarrage du jeu."
 EU4HARMONY_SETTINGS_SAVE:0 "Enregistrer"
 EU4HARMONY_SETTINGS_CANCEL:0 "Annuler"
