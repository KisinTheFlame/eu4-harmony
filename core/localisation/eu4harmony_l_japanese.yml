l_japanese:
 # フレームワーク自身のテキスト：プレイヤー向け通知。
 EU4HARMONY_NOTICE_TITLE:0 "Harmony"
 EU4HARMONY_NOTICE_TITLE_MORE:0 "Harmony（ほか $COUNT$ 件）"
 EU4HARMONY_SKIPPED_MANIFEST:0 "Mod「$MOD$」をスキップしました：eu4-harmony/manifest.toml が無効です。\n$DETAIL$"
 EU4HARMONY_SKIPPED_DUPLICATE_ID:0 "Mod「$MOD$」をスキップしました：ID「$ID$」は先に有効化された別の Mod で使用されています。"
 EU4HARMONY_STARTUP_FAILED:0 "Harmony を起動できなかったため、Harmony 対応 Mod は無効になっています。\n\n$DETAIL$"
 EU4HARMONY_STARTUP_WRONG_PLATFORM:0 "Harmony を起動できませんでした：このゲームは $PLATFORM$ 版ですが、Harmony は Steam Windows 版の EU4 1.37.5 のみ対応しています。\n\nSteam Windows 版のゲームで Harmony を起動してください。"
 EU4HARMONY_STARTUP_WRONG_VERSION:0 "Harmony を起動できませんでした：現在のゲームバージョンは $VERSION$ ですが、Harmony は Steam Windows 版 EU4 1.37.5 のみ対応しています。\n\nSteam でゲームを 1.37.5 に切り替えて（Europa Universalis IV を右クリック → プロパティ → ベータ）、再度起動してください。"
 EU4HARMONY_STARTUP_MODIFIED_EXE:0 "Harmony を起動できませんでした：ゲームフォルダ内の eu4.exe が他のパッチ等により変更されています。Harmony には再起動なしでのメインメニュー復帰、パフォーマンス改善、後継者名の修正、実績オプションがすでに含まれています。\n\nSteam で Europa Universalis IV を右クリック → プロパティ → インストール済みファイル → ゲームファイルの整合性を確認を実行して元の eu4.exe を復元し（Harmony の再インストールは不要です）、再度ゲームを起動してください。"
 EU4HARMONY_STARTUP_UNSUPPORTED_OR_MODIFIED_EXE:0 "Harmony を起動できませんでした：eu4.exe が Steam Windows 版 EU4 1.37.5 と一致しません。別バージョンであるか、eu4.exe が変更されている可能性があります。\n\nSteam でゲームバージョンが 1.37.5 であることを確認し、ゲームファイルの整合性を確認（Europa Universalis IV を右クリック → プロパティ → インストール済みファイル）を実行して元の eu4.exe を復元してから再起動してください。"
 EU4HARMONY_STARTUP_CONFLICTING_DLLS:0 "Harmony を起動できませんでした：ゲームフォルダから別のパッチ DLL が同時に読み込まれており、Harmony と競合しています（$DLLS$）。\n\nこれらのファイルをゲームフォルダの外へ移動してから、ゲームを再度起動してください。"
 EU4HARMONY_PROXY_OUTDATED:0 "Harmony を起動できなかったため、対応 Mod は無効になっています：ゲームフォルダ内の version.dll が古すぎます。\n\nSteam ワークショップの Harmony フォルダから version.dll をゲームフォルダ（eu4.exe の隣）へ再度コピーしてください。"
 EU4HARMONY_PROXY_UPDATED_RESTART:0 "Harmony はゲームフォルダ内の version.dll を更新しましたが、ゲームを自動で再起動できませんでした。\n\n更新された version.dll を使うには、ゲームを閉じてからもう一度起動してください。"
 EU4HARMONY_PROXY_UPDATE_FAILED:0 "Harmony はゲームフォルダ内の version.dll を自動更新できませんでした（フォルダが読み取り専用または使用中の可能性があります）。このままプレイできますが、Steam ワークショップの Harmony フォルダから version.dll を eu4.exe の隣へ手動でコピーすることもできます。"
 EU4HARMONY_PROXY_RESTARTING:0 "Harmony が更新されました。ゲームを再起動しています…"
 EU4HARMONY_FATAL:0 "Harmony で予期しないエラーが発生したため、ゲームを終了します。\n\n$DETAIL$\n\n詳細はゲームのドキュメントフォルダ内の eu4-harmony/logs/core.log に記録されています。"
 EU4HARMONY_API_MISMATCH:0 "Mod「$MOD$」を読み込めませんでした：Harmony API $BUILT$ 向けに作成されていますが、現在の Harmony は API $PROVIDED$ を提供しています。一致するように Mod または Harmony を更新してください。"
 EU4HARMONY_NOT_LOADED:0 "Mod「$MOD$」を読み込めませんでした：\n$DETAIL$"
 EU4HARMONY_STOPPED:0 "Mod「$MOD$」の拡張機能を停止しました：$DETAIL$"
 EU4HARMONY_ERRORS:0 "Mod「$MOD$」の拡張機能でエラーが発生しました。動作は継続されます。詳細は「Harmony 設定 → 詳細設定」からログフォルダを開いて確認してください。"
 EU4HARMONY_FONT_MISSING:0 "Harmony 設定で選択されたフォント「$FONT$」がインストールされていないため、代わりに $DEFAULT$ を使用しています。設定で別のフォントを選択してください。"
 EU4HARMONY_IRONMAN_SAVE_FAILED:0 "アイアンマンセーブを保存できなかったため、ゲームを終了しませんでした。セーブフォルダ、空き容量、クラウド接続を確認してやり直してください。"
 EU4HARMONY_CONFIRM_LOAD_IRONMAN:0 "セーブデータ $NAME$ を読み込みますか？現在のアイアンマンゲームは先に保存されます。"
 EU4HARMONY_STILL_RETURN:0 "メインメニューに戻っています…"
