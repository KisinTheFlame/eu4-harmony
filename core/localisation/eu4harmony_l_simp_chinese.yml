l_simp_chinese:
 # 框架自己的文字：给玩家的提示。
 EU4HARMONY_NOTICE_TITLE:0 "Harmony"
 EU4HARMONY_NOTICE_TITLE_MORE:0 "Harmony（还有 $COUNT$ 条）"
 EU4HARMONY_SKIPPED_MANIFEST:0 "已跳过 Mod「$MOD$」：它的 eu4-harmony/manifest.toml 有误。\n$DETAIL$"
 EU4HARMONY_SKIPPED_DUPLICATE_ID:0 "已跳过 Mod「$MOD$」：它的 id「$ID$」已被前面启用的另一个 Mod 使用。"
 EU4HARMONY_STARTUP_FAILED:0 "Harmony 没能启动，基于它的 Mod 都不会生效。\n\n$DETAIL$"
 EU4HARMONY_STARTUP_WRONG_PLATFORM:0 "Harmony 没能启动：当前游戏来自 $PLATFORM$，而 Harmony 仅支持 Steam 平台的 Windows 版《欧陆风云4》1.37.5。\n\n请在 Steam 平台的 Windows 版游戏中使用 Harmony。"
 EU4HARMONY_STARTUP_WRONG_VERSION:0 "Harmony 没能启动：当前游戏版本是 $VERSION$，而 Harmony 仅支持 Steam 平台的 Windows 版 1.37.5。\n\n请在 Steam 中将游戏切回 1.37.5（右键《欧陆风云4》→ 属性 → 测试版）后重新启动游戏。"
 EU4HARMONY_STARTUP_MODIFIED_EXE:0 "Harmony 没能启动：游戏目录里的 eu4.exe 已被其他补丁修改过。Harmony 已内置返回主菜单不重启、性能提升、修复继承人重名与成就选项，无需再使用修改版 eu4.exe。\n\n请在 Steam 中右键《欧陆风云4》→ 属性 → 已安装文件 → 验证游戏文件的完整性，以恢复原版 eu4.exe（无需重装 Harmony），然后重新启动游戏。"
 EU4HARMONY_STARTUP_UNSUPPORTED_OR_MODIFIED_EXE:0 "Harmony 没能启动：当前 eu4.exe 与 Steam 平台的 Windows 版 1.37.5 不一致——游戏可能不是 1.37.5，或 eu4.exe 已被修改过。\n\n请在 Steam 中确认游戏版本为 1.37.5，并右键《欧陆风云4》→ 属性 → 已安装文件 → 验证游戏文件的完整性以恢复原版 eu4.exe，然后重新启动游戏。"
 EU4HARMONY_STARTUP_CONFLICTING_DLLS:0 "Harmony 没能启动：游戏目录里还有其他补丁 DLL 被同时加载，与 Harmony 冲突（$DLLS$）。\n\n请将这些文件移出游戏目录，然后重新启动游戏。"
 EU4HARMONY_PROXY_OUTDATED:0 "Harmony 没能启动，基于它的 Mod 都不会生效：游戏目录里的 version.dll 太旧了。\n\n请从 Harmony 在 Steam 创意工坊的文件夹里重新复制 version.dll 到游戏目录，放在 eu4.exe 旁边。"
 EU4HARMONY_PROXY_UPDATED_RESTART:0 "Harmony 已自动更新游戏目录里的 version.dll，但未能自动重启游戏。\n\n请关闭游戏后重新启动，以使用新的 version.dll。"
 EU4HARMONY_PROXY_UPDATE_FAILED:0 "Harmony 未能自动更新游戏目录里的 version.dll（目录可能只读或被占用）。游戏仍可继续运行，你也可以从 Harmony 的 Steam 创意工坊文件夹手动复制 version.dll 到 eu4.exe 旁。"
