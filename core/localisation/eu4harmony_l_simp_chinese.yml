 EU4HARMONY_API_MISMATCH:0 "Mod「$MOD$」没有加载：它是为 Harmony 接口 $BUILT$ 制作的，而已安装的 Harmony 提供的是 $PROVIDED$。请更新 Mod 或 Harmony，让两者一致。"
