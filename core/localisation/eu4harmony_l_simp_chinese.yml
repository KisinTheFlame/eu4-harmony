l_simp_chinese:
 # 框架自己的文字：给玩家的提示。
 EU4HARMONY_NOTICE_TITLE:0 "EU4 Harmony"
 EU4HARMONY_NOTICE_TITLE_MORE:0 "EU4 Harmony（还有 $COUNT$ 条）"
 EU4HARMONY_SKIPPED_MANIFEST:0 "已跳过 Mod“$MOD$”：它的 eu4-harmony/manifest.json 有误。\n$DETAIL$"
 EU4HARMONY_SKIPPED_DUPLICATE_ID:0 "已跳过 Mod“$MOD$”：它的 id“$ID$”已被前面启用的另一个 Mod 使用。"
 EU4HARMONY_STARTUP_FAILED:0 "EU4 Harmony 没能启动，基于它的 Mod 都不会生效。\n\n$DETAIL$"
 EU4HARMONY_FATAL:0 "EU4 Harmony 遇到意外错误，游戏即将关闭。\n\n$DETAIL$\n\n详情见游戏文档目录下的 eu4-harmony/logs/core.log。"
 EU4HARMONY_API_MISMATCH:0 "Mod“$MOD$”没有加载：它是为 EU4 Harmony 接口 $BUILT$ 制作的，而已安装的 EU4 Harmony 提供的是 $PROVIDED$。请更新 Mod 或 EU4 Harmony，让两者一致。"
 EU4HARMONY_NOT_LOADED:0 "Mod“$MOD$”没有加载：\n$DETAIL$"
 EU4HARMONY_STOPPED:0 "Mod“$MOD$”的扩展出错，已停止运行：$DETAIL$\n\n游戏状态可能已不一致，请不要覆盖原有存档。"
 EU4HARMONY_TEST_NOTICE:0 "EU4 Harmony 测试提示 $NUMBER$。点角上的按钮关闭。"
 EU4HARMONY_FONT_MISSING:0 "EU4 Harmony 设置中选择的字体“$FONT$”未安装，已改用$DEFAULT$。请在设置中另选字体。"
 EU4HARMONY_SETTINGS_BUTTON:0 "EU4 Harmony 设置"
 EU4HARMONY_SETTINGS_TITLE:0 "EU4 Harmony 设置"
 EU4HARMONY_SETTINGS_BODY_FONT:0 "正文字体"
 EU4HARMONY_SETTINGS_BODY_WEIGHT:0 "正文字重"
 EU4HARMONY_SETTINGS_HEADING_FONT:0 "标题字体"
 EU4HARMONY_SETTINGS_HEADING_WEIGHT:0 "标题字重"
 EU4HARMONY_SETTINGS_MAP_FONT:0 "地图字体"
 EU4HARMONY_SETTINGS_MAP_WEIGHT:0 "地图字重"
 EU4HARMONY_SETTINGS_MAP_OUTLINE:0 "地图文字包边"
 EU4HARMONY_SETTINGS_OUTLINE_FONT:0 "与游戏地图字体相同"
 EU4HARMONY_SETTINGS_OUTLINE_NONE:0 "无"
 EU4HARMONY_SETTINGS_RESTART:0 "修改在下次启动游戏后生效。"
 EU4HARMONY_SETTINGS_SAVE:0 "保存"
 EU4HARMONY_SETTINGS_CANCEL:0 "取消"
 # 游戏在代码里按英文顺序写的日期，在这个语言里的写法；没有这几条的语言保持游戏原样。
 EU4HARMONY_DATE:0 "$YEAR$年$MONTH_NUMBER$月$DAY$日"
 EU4HARMONY_DATE_MONTH:0 "$YEAR$年$MONTH_NUMBER$月"
 EU4HARMONY_DATE_YEAR:0 "公元$YEAR$年"
 EU4HARMONY_DATE_YEAR_BC:0 "公元前$YEAR$年"
 # 东亚文化的人名姓在前；两个汉字之间的空格会去掉。
 EU4HARMONY_NAME_FAMILY_FIRST:0 "$FAMILY$ $GIVEN$"
 # 战役名：$KIND$ 是游戏的“战役”“围攻”“占领”，$PLACE$ 是省名。
 EU4HARMONY_BATTLE:0 "$PLACE$$KIND$"
 EU4HARMONY_SIEGE:0 "$KIND$$PLACE$"
 EU4HARMONY_OCCUPATION:0 "$KIND$$PLACE$"
