 # 游戏在代码里按英文顺序写的日期，在这个语言里的写法；没有这几条的语言保持游戏原样。
 EU4HARMONY_DATE:0 "$YEAR$年$MONTH_NUMBER$月$DAY$日"
 EU4HARMONY_DATE_MONTH:0 "$YEAR$年$MONTH_NUMBER$月"
 EU4HARMONY_DATE_YEAR:0 "公元$YEAR$年"
 EU4HARMONY_DATE_YEAR_BC:0 "公元前$YEAR$年"
 # 东亚文化的人名姓在前；两个汉字之间的空格会去掉。
 EU4HARMONY_NAME_FAMILY_FIRST:0 "$FAMILY$ $GIVEN$"
 # 战役名：$KIND$ 是游戏的“战役”“围攻”“占领”，$PLACE$ 是省名。
 EU4HARMONY_BATTLE:0 "$PLACE$$KIND$"
 EU4HARMONY_SIEGE:0 "$KIND$$PLACE$"
 EU4HARMONY_OCCUPATION:0 "$KIND$$PLACE$"
