l_korean:
 # 프레임워크 자체 텍스트: 플레이어 안내.
 EU4HARMONY_NOTICE_TITLE:0 "Harmony"
 EU4HARMONY_NOTICE_TITLE_MORE:0 "Harmony ($COUNT$개 더 있음)"
 EU4HARMONY_SKIPPED_MANIFEST:0 "모드 \"$MOD$\"을(를) 건너뛰었습니다: eu4-harmony/manifest.toml 파일이 올바르지 않습니다.\n$DETAIL$"
 EU4HARMONY_SKIPPED_DUPLICATE_ID:0 "모드 \"$MOD$\"을(를) 건너뛰었습니다: ID \"$ID$\"이(가) 먼저 활성화된 다른 모드에서 이미 사용 중입니다."
 EU4HARMONY_STARTUP_FAILED:0 "Harmony를 시작하지 못해 Harmony 기반 모드가 비활성화되었습니다.\n\n$DETAIL$"
 EU4HARMONY_STARTUP_WRONG_PLATFORM:0 "Harmony를 시작하지 못했습니다: 이 게임은 $PLATFORM$ 버전이며, Harmony는 Steam Windows용 EU4 1.37.5만 지원합니다.\n\nSteam Windows 버전 게임에서 Harmony를 실행하세요."
 EU4HARMONY_STARTUP_WRONG_VERSION:0 "Harmony를 시작하지 못했습니다: 현재 게임 버전은 $VERSION$이며, Harmony는 Steam Windows용 EU4 1.37.5만 지원합니다.\n\nSteam에서 게임을 1.37.5로 전환한 뒤(Europa Universalis IV 우클릭 → 속성 → 베타) 게임을 다시 시작하세요."
 EU4HARMONY_STARTUP_MODIFIED_EXE:0 "Harmony를 시작하지 못했습니다: 게임 폴더의 eu4.exe가 다른 패치 등에 의해 수정되었습니다. Harmony에는 재시작 없는 메인 메뉴 복귀, 성능 개선, 후계자 이름 수정 및 도전과제 옵션이 이미 포함되어 있습니다.\n\nSteam에서 Europa Universalis IV 우클릭 → 속성 → 설치된 파일 → 게임 파일 무결성 검사를 실행해 원본 eu4.exe를 복원한 뒤(Harmony를 재설치할 필요는 없습니다) 게임을 다시 시작하세요."
 EU4HARMONY_STARTUP_UNSUPPORTED_OR_MODIFIED_EXE:0 "Harmony를 시작하지 못했습니다: eu4.exe가 Steam Windows용 EU4 1.37.5와 일치하지 않습니다. 다른 버전이거나 eu4.exe가 수정되었을 수 있습니다.\n\nSteam에서 게임이 1.37.5 버전인지 확인하고, 게임 파일 무결성 검사(Europa Universalis IV 우클릭 → 속성 → 설치된 파일)로 원본 eu4.exe를 복원한 뒤 다시 시작하세요."
 EU4HARMONY_STARTUP_CONFLICTING_DLLS:0 "Harmony를 시작하지 못했습니다: 게임 폴더에서 다른 패치 DLL이 함께 로드되어 Harmony와 충돌합니다($DLLS$).\n\n해당 파일들을 게임 폴더 밖으로 옮긴 뒤 게임을 다시 시작하세요."
 EU4HARMONY_PROXY_OUTDATED:0 "Harmony를 시작하지 못해 기반 모드가 비활성화되었습니다: 게임 폴더의 version.dll이 너무 오래되었습니다.\n\nSteam 창작마당의 Harmony 폴더에서 version.dll을 게임 폴더(eu4.exe 옆)로 다시 복사하세요."
 EU4HARMONY_PROXY_UPDATED_RESTART:0 "Harmony가 게임 폴더의 version.dll을 업데이트했지만 게임을 자동으로 재시작하지 못했습니다.\n\n새 version.dll을 사용하려면 게임을 닫았다가 다시 실행하세요."
 EU4HARMONY_PROXY_RESTARTING:0 "Harmony가 업데이트되었습니다. 게임을 다시 시작하는 중…"
 EU4HARMONY_FATAL:0 "Harmony에서 예기치 않은 오류가 발생하여 게임이 종료됩니다.\n\n$DETAIL$\n\n자세한 내용은 게임 문서 폴더의 eu4-harmony/logs/core.log에서 확인할 수 있습니다."
 EU4HARMONY_API_MISMATCH:0 "모드 \"$MOD$\"을(를) 불러오지 못했습니다: Harmony API $BUILT$용으로 제작되었지만 설치된 Harmony는 API $PROVIDED$를 제공합니다. 일치하도록 모드 또는 Harmony를 업데이트하세요."
 EU4HARMONY_NOT_LOADED:0 "모드 \"$MOD$\"을(를) 불러오지 못했습니다:\n$DETAIL$"
 EU4HARMONY_STOPPED:0 "모드 \"$MOD$\"의 확장이 중지되었습니다: $DETAIL$"
 EU4HARMONY_ERRORS:0 "모드 \"$MOD$\"의 확장에서 오류가 발생했습니다. 실행은 계속되며 자세한 내용은 로그에 기록됩니다."
 EU4HARMONY_FONT_MISSING:0 "Harmony 설정에서 선택한 글꼴 \"$FONT$\"이(가) 설치되어 있지 않아 대신 $DEFAULT$을(를) 사용합니다. 설정에서 다른 글꼴을 선택하세요."
 EU4HARMONY_IRONMAN_SAVE_FAILED:0 "철인 저장 파일을 저장하지 못해 게임을 떠나지 않았습니다. 저장 폴더, 디스크 여유 공간 또는 클라우드 연결을 확인한 뒤 다시 시도하세요."
