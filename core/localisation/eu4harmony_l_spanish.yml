l_spanish:
 # Los textos propios del framework: avisos al jugador.
 EU4HARMONY_NOTICE_TITLE:0 "Harmony"
 EU4HARMONY_NOTICE_TITLE_MORE:0 "Harmony ($COUNT$ más)"
 EU4HARMONY_SKIPPED_MANIFEST:0 "Se omitió el mod «$MOD$»: su archivo eu4-harmony/manifest.toml no es válido.\n$DETAIL$"
 EU4HARMONY_SKIPPED_DUPLICATE_ID:0 "Se omitió el mod «$MOD$»: su id «$ID$» ya lo usa un mod cargado antes."
 EU4HARMONY_STARTUP_FAILED:0 "Harmony no pudo iniciarse, así que los mods basados en él están inactivos.\n\n$DETAIL$"
 EU4HARMONY_STARTUP_WRONG_PLATFORM:0 "Harmony no pudo iniciarse: este juego procede de $PLATFORM$, y Harmony solo es compatible con la versión de Steam para Windows de EU4 1.37.5.\n\nUsa Harmony con la versión de Steam para Windows del juego."
 EU4HARMONY_STARTUP_WRONG_VERSION:0 "Harmony no pudo iniciarse: este juego está en la versión $VERSION$, y Harmony solo es compatible con EU4 1.37.5 en Steam para Windows.\n\nCambia el juego a la versión 1.37.5 en Steam (clic derecho en Europa Universalis IV → Propiedades → Betas) y vuelve a iniciar el juego."
 EU4HARMONY_STARTUP_MODIFIED_EXE:0 "Harmony no pudo iniciarse: el archivo eu4.exe en la carpeta del juego ha sido modificado (por ejemplo, por otro parche del ejecutable). Harmony ya incluye el regreso al menú principal sin reiniciar, mejoras de rendimiento, la corrección de nombres de herederos y las opciones de logros.\n\nEn Steam, haz clic derecho en Europa Universalis IV → Propiedades → Archivos instalados → Verificar integridad de los archivos del juego para restaurar el eu4.exe original (no hace falta reinstalar Harmony) y vuelve a iniciar el juego."
 EU4HARMONY_STARTUP_UNSUPPORTED_OR_MODIFIED_EXE:0 "Harmony no pudo iniciarse: eu4.exe no coincide con EU4 1.37.5 de Steam para Windows — puede que el juego esté en otra versión o que eu4.exe haya sido modificado.\n\nAsegúrate en Steam de que el juego esté en la versión 1.37.5, verifica la integridad de los archivos del juego (clic derecho en Europa Universalis IV → Propiedades → Archivos instalados) para restaurar el eu4.exe original y vuelve a iniciar el juego."
 EU4HARMONY_STARTUP_CONFLICTING_DLLS:0 "Harmony no pudo iniciarse: otro parche se cargó desde la carpeta del juego y entra en conflicto con Harmony ($DLLS$).\n\nMueve esos archivos fuera de la carpeta del juego y vuelve a iniciar el juego."
 EU4HARMONY_PROXY_OUTDATED:0 "Harmony no pudo iniciarse, así que los mods basados en él están inactivos: el archivo version.dll de la carpeta del juego es demasiado antiguo.\n\nVuelve a copiar version.dll desde la carpeta de Harmony en el Workshop de Steam a la carpeta del juego, junto a eu4.exe."
 EU4HARMONY_PROXY_UPDATED_RESTART:0 "Harmony actualizó version.dll en la carpeta del juego, pero no pudo reiniciar el juego automáticamente.\n\nCierra el juego y vuelve a iniciarlo para usar el nuevo archivo version.dll."
 EU4HARMONY_PROXY_UPDATE_FAILED:0 "Harmony no pudo actualizar version.dll automáticamente en la carpeta del juego (puede que la carpeta sea de solo lectura o esté bloqueada). El juego puede seguir funcionando, o puedes copiar manualmente version.dll desde la carpeta de Harmony en el Workshop de Steam junto a eu4.exe."
 EU4HARMONY_PROXY_RESTARTING:0 "Harmony se ha actualizado. Reiniciando el juego…"
 EU4HARMONY_FATAL:0 "Harmony encontró un error inesperado y el juego se cerrará.\n\n$DETAIL$\n\nLos detalles están en eu4-harmony/logs/core.log, en la carpeta de documentos del juego."
 EU4HARMONY_API_MISMATCH:0 "No se cargó el mod «$MOD$»: se creó para la API $BUILT$ de Harmony, pero el Harmony instalado ofrece la API $PROVIDED$. Actualiza el mod o Harmony para que coincidan."
 EU4HARMONY_NOT_LOADED:0 "No se cargó el mod «$MOD$»:\n$DETAIL$"
 EU4HARMONY_STOPPED:0 "La extensión del mod «$MOD$» se detuvo: $DETAIL$"
 EU4HARMONY_ERRORS:0 "La extensión del mod «$MOD$» tuvo un error. Sigue funcionando; abre la carpeta de registros en Ajustes de Harmony → Avanzado para ver los detalles."
 EU4HARMONY_FONT_MISSING:0 "La fuente «$FONT$» elegida en la configuración de Harmony no está instalada; se usa $DEFAULT$ en su lugar. Elige otra fuente en la configuración."
 EU4HARMONY_IRONMAN_SAVE_FAILED:0 "No se pudo guardar la partida Ironman, así que no se ha salido de ella. Comprueba la carpeta de partidas guardadas, el espacio libre en disco o la conexión a la nube e inténtalo de nuevo."
 EU4HARMONY_CONFIRM_LOAD_IRONMAN:0 "¿Cargar la partida $NAME$? La partida Ironman actual se guardará antes."
