 EU4HARMONY_SETTINGS_SOUND_INFO:0 "Die Lautstärkeregler des Spiels folgen dem Quadrat ihrer Stellung, damit jeder Schritt etwa gleich stark klingt. Gleich laute Stücke: Jedes Stück wird beim Abspielen gemessen und auf dieselbe Lautheit gebracht; ein zum ersten Mal gehörtes Stück pendelt sich in wenigen Sekunden ein. Das Angleichen hebt leise Passagen an und senkt laute, damit die Musik auch bei geringer Lautstärke hörbar bleibt, auf Kosten eines Teils ihrer Dynamik."
