l_german:
 # Die eigenen Texte des Frameworks: Hinweise an den Spieler.
 EU4HARMONY_NOTICE_TITLE:0 "Harmony"
 EU4HARMONY_NOTICE_TITLE_MORE:0 "Harmony ($COUNT$ weitere)"
 EU4HARMONY_SKIPPED_MANIFEST:0 "Die Mod „$MOD$“ wurde übersprungen: Ihre Datei eu4-harmony/manifest.toml ist ungültig.\n$DETAIL$"
 EU4HARMONY_SKIPPED_DUPLICATE_ID:0 "Die Mod „$MOD$“ wurde übersprungen: Ihre ID „$ID$“ wird bereits von einer früher geladenen Mod verwendet."
 EU4HARMONY_STARTUP_FAILED:0 "Harmony konnte nicht starten, daher sind die darauf aufbauenden Mods inaktiv.\n\n$DETAIL$"
 EU4HARMONY_STARTUP_WRONG_PLATFORM:0 "Harmony konnte nicht starten: Dieses Spiel stammt von $PLATFORM$, und Harmony unterstützt nur die Steam-Windows-Version von EU4 1.37.5.\n\nVerwenden Sie Harmony mit der Steam-Windows-Version des Spiels."
 EU4HARMONY_STARTUP_WRONG_VERSION:0 "Harmony konnte nicht starten: Dieses Spiel hat Version $VERSION$, und Harmony unterstützt nur EU4 1.37.5 auf Steam unter Windows.\n\nWechseln Sie in Steam auf Version 1.37.5 (Rechtsklick auf Europa Universalis IV → Eigenschaften → Betas) und starten Sie das Spiel erneut."
 EU4HARMONY_STARTUP_MODIFIED_EXE:0 "Harmony konnte nicht starten: Die Datei eu4.exe im Spielordner wurde verändert (etwa durch einen anderen Patch der ausführbaren Datei). Harmony enthält bereits die Rückkehr ins Hauptmenü ohne Neustart, Leistungsverbesserungen, die Korrektur der Erben-Namen und Errungenschaftsoptionen.\n\nKlicken Sie in Steam mit der rechten Maustaste auf Europa Universalis IV → Eigenschaften → Installierte Dateien → Dateien auf Fehler überprüfen, um die ursprüngliche eu4.exe wiederherzustellen (Harmony muss nicht neu installiert werden), und starten Sie das Spiel erneut."
 EU4HARMONY_STARTUP_UNSUPPORTED_OR_MODIFIED_EXE:0 "Harmony konnte nicht starten: eu4.exe entspricht nicht EU4 1.37.5 für Steam unter Windows — das Spiel hat möglicherweise eine andere Version, oder eu4.exe wurde verändert.\n\nStellen Sie in Steam sicher, dass das Spiel auf Version 1.37.5 ist, überprüfen Sie die Spieldateien auf Fehler (Rechtsklick auf Europa Universalis IV → Eigenschaften → Installierte Dateien), um die ursprüngliche eu4.exe wiederherzustellen, und starten Sie das Spiel erneut."
 EU4HARMONY_STARTUP_CONFLICTING_DLLS:0 "Harmony konnte nicht starten: Ein weiterer Patch wurde aus dem Spielordner geladen und steht im Konflikt mit Harmony ($DLLS$).\n\nVerschieben Sie diese Dateien aus dem Spielordner und starten Sie das Spiel erneut."
 EU4HARMONY_PROXY_OUTDATED:0 "Harmony konnte nicht starten, daher sind die darauf aufbauenden Mods inaktiv: Die version.dll im Spielordner ist zu alt.\n\nKopieren Sie version.dll erneut aus dem Ordner von Harmony im Steam Workshop in den Spielordner, neben eu4.exe."
 EU4HARMONY_PROXY_UPDATED_RESTART:0 "Harmony hat version.dll im Spielordner aktualisiert, konnte das Spiel jedoch nicht automatisch neu starten.\n\nSchließen Sie das Spiel und starten Sie es erneut, um die aktualisierte version.dll zu verwenden."
 EU4HARMONY_PROXY_UPDATE_FAILED:0 "Harmony konnte version.dll im Spielordner nicht automatisch aktualisieren (der Ordner ist möglicherweise schreibgeschützt oder gesperrt). Das Spiel läuft trotzdem weiter; Sie können version.dll auch manuell aus dem Steam-Workshop-Ordner von Harmony neben eu4.exe kopieren."
 EU4HARMONY_PROXY_RESTARTING:0 "Harmony wurde aktualisiert. Das Spiel wird neu gestartet …"
 EU4HARMONY_FATAL:0 "Harmony ist auf einen unerwarteten Fehler gestoßen, und das Spiel wird beendet.\n\n$DETAIL$\n\nEinzelheiten stehen in eu4-harmony/logs/core.log im Dokumente-Ordner des Spiels."
 EU4HARMONY_API_MISMATCH:0 "Die Mod „$MOD$“ wurde nicht geladen: Sie wurde für die Harmony-API $BUILT$ erstellt, das installierte Harmony bietet aber API $PROVIDED$. Aktualisieren Sie die Mod oder Harmony, damit beide zusammenpassen."
 EU4HARMONY_NOT_LOADED:0 "Die Mod „$MOD$“ wurde nicht geladen:\n$DETAIL$"
 EU4HARMONY_STOPPED:0 "Die Erweiterung der Mod „$MOD$“ wurde angehalten: $DETAIL$"
 EU4HARMONY_ERRORS:0 "In der Erweiterung der Mod „$MOD$“ ist ein Fehler aufgetreten. Sie läuft weiter; öffnen Sie den Protokollordner unter Harmony-Einstellungen → Erweitert für Einzelheiten."
 EU4HARMONY_FONT_MISSING:0 "Die in den Einstellungen von Harmony gewählte Schriftart „$FONT$“ ist nicht installiert; stattdessen wird $DEFAULT$ verwendet. Wählen Sie in den Einstellungen eine andere Schriftart."
 EU4HARMONY_IRONMAN_SAVE_FAILED:0 "Das Ironman-Spiel konnte nicht gespeichert werden und wurde daher nicht verlassen. Prüfen Sie den Spielstandordner, den freien Speicherplatz oder die Cloud-Verbindung und versuchen Sie es erneut."
