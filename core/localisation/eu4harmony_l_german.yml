 EU4HARMONY_API_MISMATCH:0 "Die Mod „$MOD$“ wurde nicht geladen: Sie wurde für die EU4-Harmony-API $BUILT$ erstellt, das installierte EU4 Harmony bietet aber API $PROVIDED$. Aktualisieren Sie die Mod oder EU4 Harmony, damit beide zusammenpassen."
