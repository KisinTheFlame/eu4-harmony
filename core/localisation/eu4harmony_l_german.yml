 EU4HARMONY_FONT_MISSING:0 "Die in den Einstellungen von EU4 Harmony gewählte Schriftart „$FONT$“ ist nicht installiert; stattdessen wird $DEFAULT$ verwendet. Wählen Sie in den Einstellungen eine andere Schriftart."
