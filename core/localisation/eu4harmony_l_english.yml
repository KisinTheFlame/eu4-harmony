l_english:
 # The framework's own texts: notices to the player.
 EU4HARMONY_NOTICE_TITLE:0 "EU4 Harmony"
 EU4HARMONY_NOTICE_TITLE_MORE:0 "EU4 Harmony ($COUNT$ more)"
 EU4HARMONY_SKIPPED_MANIFEST:0 "Mod "$MOD$" was skipped: its eu4-harmony/manifest.json is invalid.\n$DETAIL$"
 EU4HARMONY_SKIPPED_DUPLICATE_ID:0 "Mod "$MOD$" was skipped: its id "$ID$" is already used by an earlier mod in the playset."
 EU4HARMONY_STARTUP_FAILED:0 "EU4 Harmony could not start, so mods built on it are inactive.\n\n$DETAIL$"
 EU4HARMONY_FATAL:0 "EU4 Harmony ran into an unexpected error, and the game will close.\n\n$DETAIL$\n\nDetails are in eu4-harmony/logs/core.log in the game's documents folder."
 EU4HARMONY_API_MISMATCH:0 "Mod "$MOD$" was not loaded: it was built for EU4 Harmony API $BUILT$, but the installed EU4 Harmony provides $PROVIDED$. Update the mod or EU4 Harmony so that they match."
 EU4HARMONY_NOT_LOADED:0 "Mod "$MOD$" was not loaded:\n$DETAIL$"
 EU4HARMONY_STOPPED:0 "Mod "$MOD$" failed and its extension was stopped: $DETAIL$\n\nThe game state may be inconsistent; avoid overwriting your saves."
 EU4HARMONY_TEST_NOTICE:0 "EU4 Harmony test notice $NUMBER$. Close it with the button in its corner."
 EU4HARMONY_SETTINGS_BUTTON:0 "EU4 Harmony settings"
 EU4HARMONY_SETTINGS_TITLE:0 "EU4 Harmony settings"
 EU4HARMONY_SETTINGS_APPEARANCE:0 "Text appearance"
 EU4HARMONY_SETTINGS_BITMAP:0 "Keep the fonts as they are"
 EU4HARMONY_SETTINGS_SYSTEM:0 "System fonts"
 EU4HARMONY_SETTINGS_BODY_FONT:0 "Text font"
 EU4HARMONY_SETTINGS_MAP_FONT:0 "Map font"
 EU4HARMONY_SETTINGS_RESTART:0 "Changes take effect the next time the game starts."
 EU4HARMONY_SETTINGS_SAVE:0 "Save"
