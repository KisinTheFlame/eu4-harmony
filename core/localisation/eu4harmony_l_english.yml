l_english:
 # The framework's own texts: notices to the player.
 EU4HARMONY_NOTICE_TITLE:0 "EU4 Harmony"
 EU4HARMONY_NOTICE_TITLE_MORE:0 "EU4 Harmony ($COUNT$ more)"
 EU4HARMONY_SKIPPED_MANIFEST:0 "Mod "$MOD$" was skipped: its eu4-harmony/manifest.toml is invalid.\n$DETAIL$"
 EU4HARMONY_SKIPPED_DUPLICATE_ID:0 "Mod "$MOD$" was skipped: its id "$ID$" is already used by an earlier mod in the playset."
 EU4HARMONY_STARTUP_FAILED:0 "EU4 Harmony could not start, so mods built on it are inactive.\n\n$DETAIL$"
 EU4HARMONY_FATAL:0 "EU4 Harmony ran into an unexpected error, and the game will close.\n\n$DETAIL$\n\nDetails are in eu4-harmony/logs/core.log in the game's documents folder."
 EU4HARMONY_API_MISMATCH:0 "Mod "$MOD$" was not loaded: it was built for EU4 Harmony API $BUILT$, but the installed EU4 Harmony provides $PROVIDED$. Update the mod or EU4 Harmony so that they match."
 EU4HARMONY_NOT_LOADED:0 "Mod "$MOD$" was not loaded:\n$DETAIL$"
 EU4HARMONY_STOPPED:0 "The extension of mod "$MOD$" was stopped: $DETAIL$"
 EU4HARMONY_ERRORS:0 "The extension of mod "$MOD$" ran into an error. It goes on running; its log has the details."
 EU4HARMONY_FONT_MISSING:0 "The font "$FONT$" chosen in the EU4 Harmony settings is not installed, so $DEFAULT$ is used instead. Choose another font in the settings."
 EU4HARMONY_IRONMAN_SAVE_FAILED:0 "The ironman game could not be saved, so it was not left. Check the save folder, the free disk space or the cloud connection, and try again."
 EU4HARMONY_CONFIRM_LOAD_IRONMAN:0 "Load the save $NAME$? The current ironman game is saved first."
 EU4HARMONY_STILL_RETURN:0 "Returning to the main menu…"
 EU4HARMONY_STILL_LOAD:0 "Loading the save…"
 EU4HARMONY_SETTINGS_BUTTON:0 "EU4 Harmony settings"
 EU4HARMONY_SETTINGS_TITLE:0 "EU4 Harmony settings"
 EU4HARMONY_SETTINGS_LANGUAGE:0 "Language"
 EU4HARMONY_SETTINGS_PAGE_LANGUAGE_FONTS:0 "Language and fonts"
 EU4HARMONY_SETTINGS_PAGE_SESSIONS:0 "Loading and returning"
 EU4HARMONY_SETTINGS_PAGE_ACHIEVEMENTS:0 "Achievements"
 EU4HARMONY_SETTINGS_PAGE_GAME_SPEED:0 "Game speed"
 EU4HARMONY_SETTINGS_BODY_FONT:0 "Body text font"
 EU4HARMONY_SETTINGS_BODY_WEIGHT:0 "Body text font weight"
 EU4HARMONY_SETTINGS_HEADING_FONT:0 "Heading font"
 EU4HARMONY_SETTINGS_HEADING_WEIGHT:0 "Heading font weight"
 EU4HARMONY_SETTINGS_MAP_FONT:0 "Map font"
 EU4HARMONY_SETTINGS_MAP_WEIGHT:0 "Map font weight"
 EU4HARMONY_SETTINGS_MAP_OUTLINE:0 "Outline around map names"
 EU4HARMONY_SETTINGS_CONSOLE_FONT:0 "Game console font"
 EU4HARMONY_SETTINGS_CONSOLE_WEIGHT:0 "Game console font weight"
 EU4HARMONY_SETTINGS_RESTART:0 "Language and font changes take effect the next time the game starts."
 EU4HARMONY_SETTINGS_RETURN_WITHOUT_RESTART:0 "Return to the main menu without restarting the game"
 EU4HARMONY_SETTINGS_SAVE_IRONMAN_BEFORE_LOAD:0 "In ironman, save the game before loading another save"
 EU4HARMONY_SETTINGS_UNDO:0 "Turned off, loading the same save again undoes what was played since it was written."
 EU4HARMONY_SETTINGS_FASTEST_SPEED:0 "At the fastest speed"
 EU4HARMONY_SETTINGS_FASTEST_SPEED_INFO:0 "Faster time: late in a game, days pass about a tenth faster at the fastest speed, but the map is redrawn less often, so it looks choppier and answers clicks a little later."
 EU4HARMONY_SETTINGS_PACE_SMOOTH:0 "Smooth map (as in the game)"
 EU4HARMONY_SETTINGS_PACE_FASTER:0 "Faster time"
 EU4HARMONY_SETTINGS_PAGE_REMOTE_CONTROL:0 "Remote control"
 EU4HARMONY_SETTINGS_REMOTE_FULL_VIEW:0 "Remote control sees everything"
 EU4HARMONY_SETTINGS_REMOTE_FULL_VIEW_INFO:0 "Turned off, programs using the game through remote control read only what the player sees: the map under fog of war, and of other countries what their panels show."
 EU4HARMONY_SETTINGS_PAGE_SOUND:0 "Sound"
 EU4HARMONY_SETTINGS_MUSIC_LOUDNESS:0 "Play every track equally loud"
 EU4HARMONY_SETTINGS_MUSIC_LEVELING:0 "Even out quiet and loud passages"
 EU4HARMONY_SETTINGS_SOUND_INFO:0 "The game's volume sliders go as the square of their position, so each step sounds about as large. Equally loud tracks: each track is measured as it plays and brought to the same loudness; one heard for the first time settles within a few seconds. Evening out passages raises quiet passages and lowers loud ones, so the music stays audible at a low volume, at the cost of some of its dynamics."
 EU4HARMONY_SETTINGS_ACHIEVEMENTS_OUTSIDE_IRONMAN:0 "Achievements outside ironman"
 EU4HARMONY_SETTINGS_ACHIEVEMENTS_CHANGED_CHECKSUM:0 "Achievements with a changed game checksum"
 EU4HARMONY_SETTINGS_ACHIEVEMENTS:0 "Every other rule for achievements stays the game's own. Changes take effect with the next game started or loaded."
 EU4HARMONY_SETTINGS_SAVE:0 "Save"
 EU4HARMONY_SETTINGS_CANCEL:0 "Cancel"
 EU4HARMONY_MODS_BUTTON:0 "EU4 Harmony mods"
 EU4HARMONY_MODS_TITLE:0 "EU4 Harmony mods"
 EU4HARMONY_MODS_NONE:0 "No EU4 Harmony mod is enabled in this playset."
 EU4HARMONY_MODS_VERSION:0 "Version $VERSION$"
 EU4HARMONY_MODS_NO_DESCRIPTION:0 "This mod has no description."
 EU4HARMONY_MODS_BEYOND:0 "Beyond the game, this mod can:"
 EU4HARMONY_MODS_CLOCK:0 "read the real date and time"
 EU4HARMONY_MODS_FILES:0 "keep files of its own in $FOLDER$"
 EU4HARMONY_MODS_NETWORK:0 "send and receive data over the internet, with $HOSTS$"
 EU4HARMONY_MODS_DECLARED:0 "The mod declares these itself: they say what it can do, not what it does."
 EU4HARMONY_MODS_NOTHING_BEYOND:0 "This mod does nothing beyond the game."
