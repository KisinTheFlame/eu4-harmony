l_english:
 # The framework's own texts: notices to the player.
 EU4HARMONY_NOTICE_TITLE:0 "Harmony"
 EU4HARMONY_NOTICE_TITLE_MORE:0 "Harmony ($COUNT$ more)"
 EU4HARMONY_SKIPPED_MANIFEST:0 "Mod "$MOD$" was skipped: its eu4-harmony/manifest.toml is invalid.\n$DETAIL$"
 EU4HARMONY_SKIPPED_DUPLICATE_ID:0 "Mod "$MOD$" was skipped: its id "$ID$" is already used by an earlier mod in the playset."
 EU4HARMONY_STARTUP_FAILED:0 "Harmony could not start, so mods built on it are inactive.\n\n$DETAIL$"
 EU4HARMONY_STARTUP_WRONG_PLATFORM:0 "Harmony could not start: this game comes from $PLATFORM$, and Harmony supports the Steam Windows build of EU4 1.37.5 only.\n\nStart Harmony with the Steam Windows version of the game."
 EU4HARMONY_STARTUP_WRONG_VERSION:0 "Harmony could not start: this game is $VERSION$, and Harmony supports Steam Windows EU4 1.37.5 only.\n\nSwitch the game to 1.37.5 in Steam (right-click Europa Universalis IV → Properties → Betas) and start the game again."
 EU4HARMONY_STARTUP_MODIFIED_EXE:0 "Harmony could not start: eu4.exe in the game folder has been modified (for example by another executable patch). Harmony already includes returning to the main menu without restarting, performance improvements, the heir-name fix and achievement options.\n\nIn Steam, right-click Europa Universalis IV → Properties → Installed Files → Verify integrity of game files to restore the original eu4.exe (you do not need to reinstall Harmony), then start the game again."
 EU4HARMONY_STARTUP_UNSUPPORTED_OR_MODIFIED_EXE:0 "Harmony could not start: eu4.exe does not match Steam Windows EU4 1.37.5 — the game may be another version, or eu4.exe may have been modified.\n\nMake sure the game is on 1.37.5 in Steam, and verify integrity of game files (right-click Europa Universalis IV → Properties → Installed Files) to restore the original eu4.exe, then start the game again."
 EU4HARMONY_STARTUP_CONFLICTING_DLLS:0 "Harmony could not start: another patch loaded into the game from the game folder and conflicts with Harmony ($DLLS$).\n\nMove those files out of the game folder, then start the game again."
 EU4HARMONY_PROXY_OUTDATED:0 "Harmony could not start, so mods built on it are inactive: the version.dll in the game folder is too old for it.\n\nCopy version.dll from Harmony's folder in the Steam Workshop into the game folder again, next to eu4.exe."
 EU4HARMONY_PROXY_UPDATED_RESTART:0 "Harmony updated version.dll in the game folder, but could not restart the game automatically.\n\nClose the game and start it again to use the updated version.dll."
 EU4HARMONY_PROXY_UPDATE_FAILED:0 "Harmony could not update version.dll in the game folder automatically (the folder may be read-only or locked). The game can still run, or you can copy version.dll from Harmony's Steam Workshop folder next to eu4.exe manually."
 EU4HARMONY_PROXY_RESTARTING:0 "Harmony has been updated. Restarting the game…"
 EU4HARMONY_FATAL:0 "Harmony ran into an unexpected error, and the game will close.\n\n$DETAIL$\n\nDetails are in eu4-harmony/logs/core.log in the game's documents folder."
 EU4HARMONY_API_MISMATCH:0 "Mod "$MOD$" was not loaded: it was built for Harmony API $BUILT$, but the installed Harmony provides $PROVIDED$. Update the mod or Harmony so that they match."
 EU4HARMONY_NOT_LOADED:0 "Mod "$MOD$" was not loaded:\n$DETAIL$"
 EU4HARMONY_STOPPED:0 "The extension of mod "$MOD$" was stopped: $DETAIL$"
 EU4HARMONY_ERRORS:0 "The extension of mod "$MOD$" ran into an error. It goes on running; open the log folder in Harmony settings → Advanced for details."
 EU4HARMONY_FONT_MISSING:0 "The font "$FONT$" chosen in the Harmony settings is not installed, so $DEFAULT$ is used instead. Choose another font in the settings."
 EU4HARMONY_IRONMAN_SAVE_FAILED:0 "The ironman game could not be saved, so it was not left. Check the save folder, the free disk space or the cloud connection, and try again."
 EU4HARMONY_CONFIRM_LOAD_IRONMAN:0 "Load the save $NAME$? The current ironman game is saved first."
