l_english:
 # The framework's own texts: notices to the player.
 EU4HARMONY_NOTICE_TITLE:0 "EU4 Harmony"
 EU4HARMONY_NOTICE_TITLE_MORE:0 "EU4 Harmony ($COUNT$ more)"
 EU4HARMONY_SKIPPED_MANIFEST:0 "Mod "$MOD$" was skipped: its eu4-harmony/manifest.json is invalid.\n$DETAIL$"
 EU4HARMONY_SKIPPED_DUPLICATE_ID:0 "Mod "$MOD$" was skipped: its id "$ID$" is already used by an earlier mod in the playset."
 EU4HARMONY_UNSUPPORTED_EXE:0 "This eu4.exe is not supported by EU4 Harmony, so mods built on it are inactive.\n\n$DETAIL$"
 EU4HARMONY_API_MISMATCH:0 "Mod "$MOD$" was not loaded: it was built for EU4 Harmony API $BUILT$, but the installed EU4 Harmony provides $PROVIDED$. Update the mod or EU4 Harmony so that they match."
 EU4HARMONY_NOT_LOADED:0 "Mod "$MOD$" was not loaded:\n$DETAIL$"
 EU4HARMONY_STOPPED:0 "Mod "$MOD$" failed and its extension was stopped: $DETAIL$\n\nThe game state may be inconsistent; avoid overwriting your saves."
