[package]
name = "eu4-harmony-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "EU4 Harmony core: discovers mods, splices their UI and runs their extensions"
build = "build.rs"

[lib]
name = "eu4_harmony_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
eu4-harmony-checks = { path = "../checks" }
eu4-harmony-loc = { path = "../loc" }
eu4-harmony-lua = { path = "../lua" }
eu4-harmony-manifest = { path = "../manifest" }
eu4-harmony-remote = { path = "../remote" }
# http.fetch (src/lua/http.rs): the system's proxy and, through SChannel, its
# certificates; one tokio thread sends every request.
reqwest = { workspace = true }
# Compressing saves in the background (src/saves/background.rs).
miniz_oxide = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
windows-sys = { workspace = true, features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Globalization",
    # Positions in the game's window and on the screen, for input.
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Environment",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Com",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D9",
    # Present, which the still notice calls itself.
    "Win32_Graphics_Gdi",
    # Screenshots: scaled and encoded as PNG with Windows' own imaging.
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
] }

# Reading the game's code (src/analysis.rs, the disasm example). Tests use it
# too, through the dev-dependency below.
iced-x86 = { workspace = true, features = ["decoder", "std", "instr_info", "intel"], optional = true }
# A developer build's options, in dev.toml (src/dev.rs).
toml = { workspace = true, optional = true }

[build-dependencies]
cc = { workspace = true }

[dev-dependencies]
iced-x86 = { workspace = true, features = ["decoder", "std", "instr_info"] }
toml = { workspace = true }

[features]
analysis = ["dep:iced-x86"]
# The development tools, for finding things out in the game; each is on when
# built in, with its options in dev.toml (src/dev.rs). A player's build has
# none of them, and `dev` has them all.
dev = ["dev-call-trace", "dev-memory", "dev-heap-census", "dev-command-log", "dev-test-switches"]
# Logs calls of the game functions dev.toml names (src/trace.rs).
dev-call-trace = ["analysis", "dep:toml"]
# Answers remote control's memory: what the process holds, by where it
# lies, at no cost between two asks (src/memory_account.rs).
dev-memory = ["dep:toml", "eu4-harmony-remote/dev-memory"]
# Counts the game's live heap blocks by call site, and answers remote
# control's memory.leftovers and memory.generation (src/census.rs).
dev-heap-census = ["dev-memory"]
# Logs the commands the game executes, in their written form (src/command_log.rs).
dev-command-log = ["dep:toml"]
# Makes startup fail, or shows test notices, as dev.toml says.
dev-test-switches = ["dep:toml"]

[[example]]
name = "disasm"
required-features = ["analysis"]

[lints]
workspace = true
