[package]
name = "eu4-harmony-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "EU4 Harmony core: discovers mods, splices their UI and runs their extensions"
build = "build.rs"

[lib]
name = "eu4_harmony_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
eu4-harmony-checks = { path = "../checks" }
eu4-harmony-core-macros = { path = "macros" }
eu4-harmony-folders = { path = "../folders" }
eu4-harmony-loc = { path = "../loc" }
eu4-harmony-logging = { path = "../logging" }
eu4-harmony-lua = { path = "../lua" }
eu4-harmony-manifest = { path = "../manifest" }
eu4-harmony-remote = { path = "../remote" }
# http.fetch (src/lua/http.rs): the system's proxy and, through SChannel, its
# certificates; one tokio thread sends every request.
reqwest = { workspace = true }
# Compressing saves in the background (src/speed/saving/background.rs).
miniz_oxide = { workspace = true }
lewton = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
windows-sys = { workspace = true, features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Globalization",
    # The hidden start's window, shown and cloaked.
    "Win32_Graphics_Dwm",
    # Positions in the game's window and on the screen, for input.
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Memory",
    "Win32_System_Environment",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_EventLog",
    # The process's threads, which the write watch holds (src/dev/write_watch.rs).
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    # Exception records, for the write watch (src/dev/write_watch.rs).
    "Win32_System_Kernel",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D9",
    # Present, which the still notice calls itself.
    "Win32_Graphics_Gdi",
    # Screenshots: scaled and encoded as PNG with Windows' own imaging.
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
] }

# Reading the game's code for call tracing and write watching. Tests use it
# too, through the dev-dependency below.
eu4-harmony-analysis = { path = "../analysis", optional = true }
# A developer build's options, in dev.toml (src/base/dev_options.rs).
toml = { workspace = true, optional = true }

[build-dependencies]
cc = { workspace = true }

[dev-dependencies]
eu4-harmony-analysis = { path = "../analysis" }
toml = { workspace = true }

[features]
# Serves remote control on the test game's own pipe, the one
# -harmony_test_game names, so that test games run side by side
# (src/remote/pipe.rs, docs/dev-tools.md#test-games).
dev-test-games = []
# A developer build with all development tools included, configured in dev.toml
# (src/dev/mod.rs, docs/dev-tools.md). A player build has none of them.
dev = ["dev-test-games", "dep:eu4-harmony-analysis", "dep:toml", "eu4-harmony-remote/dev"]

[lints]
workspace = true
