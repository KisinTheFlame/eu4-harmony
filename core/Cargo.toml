[package]
name = "eu4-harmony-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "EU4 Harmony core: discovers mods, splices their UI and runs their extensions"
build = "build.rs"

[lib]
name = "eu4_harmony_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
eu4-harmony-abi = { path = "../abi" }
eu4-harmony-loc = { path = "../loc" }
eu4-harmony-manifest = { path = "../manifest" }
eu4-harmony-remote = { path = "../remote" }
serde = { workspace = true }
serde_json = { workspace = true }
windows-sys = { workspace = true, features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Com",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D9",
    # Screenshots: scaled and encoded as PNG with Windows' own imaging.
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
] }

# Reading the game's code (src/analysis.rs, the disasm example). Tests use it
# too, through the dev-dependency below.
iced-x86 = { workspace = true, features = ["decoder", "std", "instr_info", "intel"], optional = true }

[build-dependencies]
cc = { workspace = true }

[dev-dependencies]
iced-x86 = { workspace = true, features = ["decoder", "std", "instr_info"] }

[features]
analysis = ["dep:iced-x86"]
# Logs calls of the game functions EU4HARMONY_TRACE names (src/trace.rs). For
# finding things out only: a player's build never has it.
trace = ["analysis"]

[[example]]
name = "disasm"
required-features = ["analysis"]

[lints]
workspace = true
