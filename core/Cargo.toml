[package]
name = "eu4-harmony-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "EU4 Harmony core: discovers mods, splices their UI and runs their extensions"
build = "build.rs"

[lib]
name = "eu4_harmony_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
eu4-harmony-abi = { path = "../abi" }
eu4-harmony-loc = { path = "../loc" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { workspace = true, features = ["Win32_Graphics_DirectWrite", "Win32_Graphics_Direct2D_Common"] }

[build-dependencies]
cc = { workspace = true }
