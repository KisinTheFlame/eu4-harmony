[package]
name = "eu4-harmony-remote"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "EU4 Harmony remote control: the requests and responses, their JSON form and a description of every capability"

[lib]
name = "eu4_harmony_remote"

[dependencies]
eu4-harmony-checks = { path = "../checks" }
eu4-harmony-remote-derive = { path = "derive" }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# The memory group, which a developer build with the heap census answers
# (src/memory.rs).
dev-memory = []
# In-process performance windows, available only in an instrumented core.
dev-performance = []

[lints]
workspace = true
