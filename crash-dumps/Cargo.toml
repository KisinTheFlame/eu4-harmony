[package]
name = "eu4-harmony-crash-dumps"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Windows Error Reporting callback that writes minidumps when eu4.exe crashes"

[lib]
crate-type = ["cdylib"]

[dependencies]
eu4-harmony-folders = { path = "../folders" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug",
    "Win32_System_ErrorReporting", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_Threading",
] }

[lints]
workspace = true
