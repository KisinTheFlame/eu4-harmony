[package]
name = "eu4-harmony-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Create, build, register and package EU4 Harmony mods"

[[bin]]
name = "eu4-harmony"
path = "src/main.rs"

[dependencies]
eu4-harmony-abi = { path = "../abi" }
serde = { workspace = true }
serde_json = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
