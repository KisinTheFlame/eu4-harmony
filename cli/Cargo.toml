[package]
name = "eu4-harmony-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Create, register and package EU4 Harmony mods, and use the running game through remote control"

[[bin]]
name = "eu4-harmony"
path = "src/main.rs"

[dependencies]
eu4-harmony-client = { path = "../client" }
eu4-harmony-folders = { path = "../folders" }
eu4-harmony-loc = { path = "../loc" }
eu4-harmony-lua = { path = "../lua" }
eu4-harmony-manifest = { path = "../manifest" }
eu4-harmony-remote = { path = "../remote" }
mlua = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Globalization",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
# The pipe tests' own server, standing in for the game.
eu4-harmony-client = { path = "../client", features = ["testing"] }

[lints]
workspace = true
