[package]
name = "eu4-harmony-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Create, build, register and package EU4 Harmony mods, and use the running game through remote control"

[[bin]]
name = "eu4-harmony"
path = "src/main.rs"

[dependencies]
eu4-harmony-abi = { path = "../abi" }
eu4-harmony-loc = { path = "../loc" }
eu4-harmony-manifest = { path = "../manifest" }
eu4-harmony-remote = { path = "../remote" }
serde = { workspace = true }
serde_json = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The tests' own pipes: one closed to everybody.
windows-sys = { workspace = true, features = ["Win32_Security_Authorization", "Win32_System_IO"] }

[lints]
workspace = true
