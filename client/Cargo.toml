[package]
name = "eu4-harmony-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Reaching the running game from outside it: remote control's pipe, the hidden start, and the backup of the player's files"

[lib]
name = "eu4_harmony_client"

[dependencies]
eu4-harmony-remote = { path = "../remote" }
serde = { workspace = true }
serde_json = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[features]
# The pipe tests' own server, a stand-in for the game, for the tests of
# programs built on the client.
testing = ["windows-sys/Win32_Security_Authorization", "windows-sys/Win32_System_IO"]

[dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Authorization", "Win32_System_IO"] }

[lints]
workspace = true
