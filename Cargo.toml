[workspace]
resolver = "2"
members = ["checks", "cli", "client", "core", "core/macros", "folders", "loc", "lua", "manifest", "logging", "proxy", "remote", "remote/derive", "xtask"]

[workspace.package]
version = "0.1.4"
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
windows-sys = "=0.61.2"
windows = "=0.62.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
cc = "=1.6.0"
iced-x86 = { version = "=1.21.0", default-features = false }
miniz_oxide = "=0.8.9"
lewton = "=0.10.2"
toml = "=0.9.8"
mlua = { version = "=0.11.6", features = ["lua54", "vendored", "serialize"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "system-proxy"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt"] }

# MSVC's linker says which import library it made for each DLL, in the
# system's language; that is no warning of ours.
[workspace.lints.rust]
linker_messages = "allow"

# Where the code is right as it is, #[expect(..., reason = "...")] says why
# (AGENTS.md): an #[allow] is refused, as is an #[expect] with no reason.
[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
# The core is one large crate. In one unit LLVM optimizes all of it on one
# thread, about 80 s after any change to it; sixteen let as many threads share
# it, about 20 s, for a DLL about 8% larger. The player package is built in
# one (profile.player).
codegen-units = 16
debug = "line-tables-only"

# The player package, which `cargo xtask release` builds and packs: the
# release build in one unit, so that LLVM optimizes the core as a whole.
[profile.player]
inherits = "release"
codegen-units = 1
