[workspace]
resolver = "2"
members = ["abi", "cli", "cli/template/extension", "core", "loc", "manifest", "proxy", "remote", "sdk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
windows-sys = "=0.61.2"
windows = "=0.62.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
cc = "=1.6.0"
iced-x86 = { version = "=1.21.0", default-features = false }

# Where the code is right as it is, #[expect(..., reason = "...")] says why
# (AGENTS.md): an #[allow] is refused, as is an #[expect] with no reason.
[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
