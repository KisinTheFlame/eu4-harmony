[workspace]
resolver = "2"
members = ["abi", "cli", "core", "loc", "proxy", "sdk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
windows-sys = "=0.61.2"
windows = "=0.62.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
cc = "=1.6.0"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
